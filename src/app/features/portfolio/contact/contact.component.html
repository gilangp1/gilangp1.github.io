<section id="contact" class="bg-[#1c2820] py-28 text-[#f7f3eb] dark:bg-[#101912]">
  <div class="container-custom">
    <p class="font-mono text-xs uppercase tracking-[0.16em] text-[#b9cf7b]">05 / Say hello</p>
    <div class="mt-5 grid gap-8 md:grid-cols-[1fr_auto] md:items-end">
      <div>
        <h2 class="font-display max-w-3xl text-5xl font-semibold leading-[1.02] tracking-[-0.045em] sm:text-6xl">Have something meaningful to build?</h2>
        <p class="mt-6 max-w-xl text-lg leading-8 text-[#c8d0c3]">I’m always open to a thoughtful conversation about products, teams, and the small details that make a big difference.</p>
      </div>
      <a [href]="'mailto:' + profile.email" class="inline-flex w-fit rounded-full bg-[#b9cf7b] px-6 py-3 font-semibold text-[#17231b] transition hover:-translate-y-0.5 hover:bg-[#d4e7a2]">Write an email ↗</a>
    </div>
  </div>
</section>
