<section
  id="resume"
  class="py-24">

  <div class="container-custom">

    <div
      class="rounded-3xl
             bg-indigo-600
             p-8 text-white
             sm:p-12
             lg:p-16">

      <div class="max-w-3xl">

        <h2
          class="text-3xl font-bold
                 sm:text-4xl">

          Interested in working together?

        </h2>

        <p
          class="mt-4 text-indigo-100">

          Download my resume to learn
          more about my professional
          experience, skills, and background.

        </p>

        <a
          [href]="profile.resume"
          download
          class="mt-8 inline-flex
                 rounded-xl bg-white
                 px-6 py-3
                 font-semibold
                 text-indigo-600
                 transition
                 hover:-translate-y-1">

          Download Resume

        </a>

      </div>

    </div>

  </div>

</section>
