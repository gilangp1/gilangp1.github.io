<section id="resume" class="py-28">
  <div class="container-custom">
    <div class="grid gap-8 border-y border-[#789343] py-10 md:grid-cols-[1.3fr_1fr] md:items-end">
      <div>
        <p class="font-mono text-xs uppercase tracking-[0.16em] text-[#60772f] dark:text-[#b9cf7b]">A fuller picture</p>
        <h2 class="font-display mt-3 max-w-2xl text-4xl font-semibold tracking-[-0.035em] sm:text-5xl">Want the details? They’re all in the CV.</h2>
      </div>
      <div class="md:justify-self-end">
        <p class="max-w-sm text-sm leading-6 text-[#657064] dark:text-[#b5beb1]">A concise overview of my experience, technical background, and the teams I have worked with.</p>
        <a [href]="profile.resume" download class="mt-6 inline-flex rounded-full bg-[#1c2820] px-6 py-3 font-semibold text-[#f7f3eb] transition hover:bg-[#516b25] dark:bg-[#b9cf7b] dark:text-[#17231b]">Download CV ↘</a>
      </div>
    </div>
  </div>
</section>
