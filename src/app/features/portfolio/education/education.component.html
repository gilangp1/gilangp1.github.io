<section
  id="education"
  class="py-24">

  <div class="container-custom">

    <p
      class="font-semibold
             text-indigo-500">

      Education

    </p>

    <h2
      class="mt-2 text-4xl font-bold">

      Academic Background

    </h2>

    <div
      class="mt-10 grid gap-6
             md:grid-cols-2">

      @for (
        item of education;
        track item.institution
      ) {

        <div
          class="rounded-3xl
                 border border-slate-200
                 p-8
                 dark:border-slate-800">

          <span
            class="text-sm
                   text-indigo-500">

            {{ item.startDate }}
            -
            {{ item.endDate }}

          </span>

          <h3
            class="mt-3
                   text-xl font-bold">

            {{ item.degree }}

          </h3>

          <p class="mt-2 font-medium">

            {{ item.field }}

          </p>

          <p
            class="mt-1
                   text-slate-500">

            {{ item.institution }}

          </p>

          <p
            class="mt-4
                   text-sm leading-6
                   text-slate-600
                   dark:text-slate-400">

            {{ item.description }}

          </p>

        </div>

      }

    </div>

  </div>

</section>
