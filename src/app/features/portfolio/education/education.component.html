<section id="education" class="border-y border-[#d9d2c5] bg-[#ebe5d9] py-28 dark:border-[#405042] dark:bg-[#203025]">
  <div class="container-custom">
    <p class="font-mono text-xs uppercase tracking-[0.16em] text-[#516b25] dark:text-[#b9cf7b]">04 / Foundation</p>
    <h2 class="font-display mt-3 text-4xl font-semibold tracking-[-0.035em] sm:text-5xl">Where the curiosity began.</h2>
    <div class="mt-12 max-w-3xl border-t border-[#c8c0b1] pt-6 dark:border-[#506052]">
      @for (item of education; track item.institution) {
        <div class="grid gap-5 md:grid-cols-[150px_1fr]">
          <span class="font-mono text-xs uppercase tracking-[0.12em] text-[#60772f] dark:text-[#b9cf7b]">{{ item.startDate }} — {{ item.endDate }}</span>
          <div>
            <h3 class="font-display text-2xl font-semibold tracking-[-0.025em]">{{ item.degree }}, {{ item.field }}</h3>
            <p class="mt-2 font-medium text-[#394539] dark:text-[#e5eadf]">{{ item.institution }}</p>
            <p class="mt-4 text-sm leading-6 text-[#657064] dark:text-[#b5beb1]">{{ item.description }}</p>
          </div>
        </div>
      }
    </div>
  </div>
</section>
