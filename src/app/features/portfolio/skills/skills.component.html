<section
  id="skills"
  class="bg-slate-50 py-24
         dark:bg-slate-900/40">

  <div class="container-custom">

    <div class="max-w-2xl">

      <p
        class="font-semibold text-indigo-500">

        Skills

      </p>

      <h2
        class="mt-2
               text-4xl font-bold
               tracking-tight">

        Technologies I Work With

      </h2>

      <p
        class="mt-4
               text-slate-600
               dark:text-slate-400">

        A collection of technologies
        and tools I use to build
        modern digital products.

      </p>

    </div>

    <div
      class="mt-10 flex flex-wrap gap-3">

      @for (
        category of categories;
        track category
      ) {

        <button
          type="button"
          (click)="selectCategory(category)"
          [class.bg-indigo-600]="
            selectedCategory() === category
          "
          [class.text-white]="
            selectedCategory() === category
          "
          class="rounded-full
                 border border-slate-300
                 px-5 py-2
                 text-sm font-medium
                 transition
                 hover:border-indigo-500
                 dark:border-slate-700">

          {{ category }}

        </button>

      }

    </div>

    <div
      class="mt-10 grid gap-4
             sm:grid-cols-2
             lg:grid-cols-4">

      @for (
        skill of filteredSkills();
        track skill.name
      ) {

        <div
          class="rounded-2xl
                 border border-slate-200
                 bg-white p-6
                 transition
                 hover:-translate-y-1
                 hover:shadow-lg
                 dark:border-slate-800
                 dark:bg-slate-950">

          <div
            class="mb-4 flex h-12 w-12
                   items-center justify-center
                   rounded-xl
                   bg-indigo-50
                   font-bold
                   text-indigo-600
                   dark:bg-indigo-950
                   dark:text-indigo-300">

            {{ skill.name.charAt(0) }}

          </div>

          <h3 class="font-semibold">

            {{ skill.name }}

          </h3>

          <p
            class="mt-1
                   text-sm
                   text-slate-500">

            {{ skill.category }}

          </p>

        </div>

      }

    </div>

  </div>

</section>
