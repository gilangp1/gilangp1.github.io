<section
  id="projects"
  class="py-24">

  <div class="container-custom">

    <div class="max-w-2xl">

      <p
        class="font-semibold
               text-indigo-500">

        Products & Projects

      </p>

      <h2
        class="mt-2 text-4xl font-bold">

        Selected Work

      </h2>

    </div>

    <div
      class="mt-12 grid gap-8
             lg:grid-cols-3">

      @for (
        project of projects;
        track project.title
      ) {

        <article
          class="group overflow-hidden
                 rounded-3xl
                 border border-slate-200
                 bg-white
                 transition
                 hover:-translate-y-2
                 hover:shadow-xl
                 dark:border-slate-800
                 dark:bg-slate-950">

          <div
            class="aspect-video
                   overflow-hidden">

            <img
              [src]="project.image"
              [alt]="project.title"
              class="h-full w-full
                     object-cover
                     transition duration-500
                     group-hover:scale-105">

          </div>

          <div class="p-6">

            <span
              class="text-sm font-medium
                     text-indigo-500">

              {{ project.category }}

            </span>

            <h3
              class="mt-2 text-xl font-bold">

              {{ project.title }}

            </h3>

            <p
              class="mt-3 text-sm
                     leading-6
                     text-slate-600
                     dark:text-slate-400">

              {{ project.description }}

            </p>

            <div
              class="mt-5 flex flex-wrap gap-2">

              @for (
                tech of project.technologies;
                track tech
              ) {

                <span
                  class="rounded-full
                         bg-slate-100
                         px-3 py-1
                         text-xs
                         dark:bg-slate-800">

                  {{ tech }}

                </span>

              }

            </div>

          </div>

        </article>

      }

    </div>

  </div>

</section>
