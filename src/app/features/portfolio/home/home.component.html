<section
  id="home"
  class="relative
         flex min-h-screen
         items-center
         overflow-hidden
         pt-16">

  <div
    class="absolute -left-40 top-20
           h-96 w-96 rounded-full
           bg-indigo-500/10 blur-3xl">
  </div>

  <div
    class="absolute -right-40 bottom-20
           h-96 w-96 rounded-full
           bg-purple-500/10 blur-3xl">
  </div>

  <div
    class="container-custom relative
           grid gap-12
           lg:grid-cols-2
           lg:items-center">

    <div>

      <span
        class="mb-5 inline-block
               rounded-full
               border border-indigo-200
               bg-indigo-50
               px-4 py-2
               text-sm font-medium
               text-indigo-600
               dark:border-indigo-900
               dark:bg-indigo-950
               dark:text-indigo-300">

        Hello, I'm

      </span>

      <h1
        class="max-w-3xl
               text-5xl font-bold
               tracking-tight
               text-slate-900
               sm:text-6xl
               lg:text-7xl
               dark:text-white">

        {{ profile.name }}

      </h1>

      <h2
        class="mt-6
               text-2xl font-semibold
               text-indigo-500
               sm:text-3xl">

        {{ profile.role }}

      </h2>

      <p
        class="mt-6 max-w-2xl
               text-lg leading-8
               text-slate-600
               dark:text-slate-400">

        {{ profile.description }}

      </p>

      <div
        class="mt-8 flex flex-wrap gap-4">

        <a
          href="#projects"
          class="rounded-xl
                 bg-indigo-600
                 px-6 py-3
                 font-semibold text-white
                 transition
                 hover:-translate-y-1
                 hover:bg-indigo-700">

          View Projects

        </a>

        <a
          [href]="profile.resume"
          download
          class="rounded-xl
                 border border-slate-300
                 px-6 py-3
                 font-semibold
                 transition
                 hover:bg-slate-100
                 dark:border-slate-700
                 dark:hover:bg-slate-800">

          Download Resume

        </a>

      </div>

    </div>

    <div
      class="flex justify-center
             lg:justify-end">

      <div class="relative">

        <div
          class="absolute inset-0
                 rounded-3xl
                 bg-indigo-500/20
                 blur-2xl">
        </div>

        <div
          class="relative
                 flex h-80 w-80
                 items-center justify-center
                 rounded-3xl
                 bg-slate-50
                 shadow-2xl
                 dark:bg-slate-900/50
                 dark:border dark:border-slate-800
                 sm:h-96 sm:w-96">
          <i
            [class]="skillIcons[currentIconIndex()]"
            class="text-[120px] 
                   transition-all duration-300
                   dark:text-white
                   sm:text-[160px]"></i>
        </div>

      </div>

    </div>

  </div>

</section>
