<header
  class="fixed inset-x-0 top-0 z-50
         border-b border-[#d9d2c5]/80
         bg-[#f7f3eb]/85 backdrop-blur-xl
         dark:border-[#405042]
         dark:bg-[#17231b]/85">

  <nav class="container-custom">

    <div
      class="flex h-16 items-center
             justify-between">

      <a
        href="#home"
        class="font-display text-xl font-bold
               tracking-tight text-[#1c2820]
               dark:text-[#f6f0e6]">

        Gilang<span class="text-[#789343]">.</span>

      </a>

      <div
        class="hidden items-center gap-7 md:flex">

        @for (
          item of menuItems;
          track item.target
        ) {

          <a
            [href]="'#' + item.target"
            class="text-sm font-medium
                   text-[#576157]
                   transition
                   hover:text-[#516b25]
                   dark:text-[#c8d0c3]
                   dark:hover:text-[#b9cf7b]">

            {{ item.label }}

          </a>

        }

        <button
          type="button"
          (click)="toggleTheme()"
          class="rounded-full
                 border border-[#d9d2c5]
                 p-2
                 hover:bg-[#ebe5d9]
                 dark:border-[#405042]
                 dark:hover:bg-[#26362a]"
          aria-label="Toggle theme">

          ◐

        </button>

      </div>

      <button
        type="button"
        class="md:hidden"
        (click)="toggleMenu()"
        aria-label="Toggle mobile menu">

        ☰

      </button>

    </div>

    @if (mobileMenuOpen()) {

      <div
        class="border-t
               border-[#d9d2c5]
               py-4
               dark:border-[#405042]
               md:hidden">

        <div class="flex flex-col gap-4">

          @for (
            item of menuItems;
            track item.target
          ) {

            <a
              [href]="'#' + item.target"
              (click)="closeMenu()"
              class="text-sm font-medium
                     text-[#576157]
                     dark:text-[#c8d0c3]">

              {{ item.label }}

            </a>

          }

          <button
            type="button"
            (click)="toggleTheme()"
            class="text-left text-sm
                   font-medium text-[#576157]
                   dark:text-[#c8d0c3]">

            Toggle Theme

          </button>

        </div>

      </div>

    }

  </nav>

</header>
